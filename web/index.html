<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Merger</title>
  <meta name="description" content="Combine PDFs into one, entirely on your device.">
  <meta name="theme-color" content="#1f4e8c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    :root {
      --bg: #ffffff; --fg: #1b1f24; --muted: #5b6573; --line: #d5dae1;
      --accent: #1f4e8c; --accent-fg: #ffffff; --panel: #f4f6f9; --danger: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181d; --fg: #e8ebef; --muted: #9aa5b4; --line: #2c333c;
        --accent: #6aa3ea; --accent-fg: #0b1522; --panel: #1c2128; --danger: #f2b8b5;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    #drop { border: 2px dashed var(--line); border-radius: 12px; padding: 28px 16px;
      text-align: center; background: var(--panel); }
    #drop.over { border-color: var(--accent); }
    button { font: inherit; border-radius: 8px; border: 1px solid var(--line);
      background: var(--bg); color: var(--fg); padding: 8px 14px; cursor: pointer; }
    button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    ol { list-style: none; margin: 20px 0; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
    li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .size { color: var(--muted); font-size: .85rem; }
    li button { padding: 4px 10px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    label.opt { display: flex; gap: 6px; align-items: center; color: var(--muted); }
    #status { margin-top: 16px; min-height: 1.5em; }
    #status.error { color: var(--danger); }
    #install { display: none; margin-left: auto; }
    footer { margin-top: 32px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <h1>PDF Merger</h1>
  <p class="sub">Combine PDFs into one. Files never leave your device.</p>

  <div id="drop">
    <p>Drop PDFs or a folder here, or</p>
    <button id="pick" class="primary" type="button">Choose PDFs</button>
    <button id="pickFolder" type="button">Choose folder</button>
    <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    <input id="folder" type="file" webkitdirectory hidden>
  </div>

  <ol id="list" aria-label="Files to merge, in order"></ol>

  <div class="actions">
    <button id="merge" class="primary" type="button" disabled>Merge</button>
    <button id="clear" type="button" disabled>Clear</button>
    <label class="opt"><input id="bookmarks" type="checkbox"> Add a bookmark per file</label>
    <button id="install" type="button">Install app</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>

  <footer>Works offline once installed.</footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
